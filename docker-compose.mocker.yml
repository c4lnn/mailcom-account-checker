services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ACCOUNT_CHECKER_DB: /data/mocker-account-checker.sqlite3
      ACCOUNT_CHECKER_ENCRYPTION_KEY: ${ACCOUNT_CHECKER_ENCRYPTION_KEY:?set ACCOUNT_CHECKER_ENCRYPTION_KEY}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:?set CONSOLE_PASSWORD}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?set CONSOLE_SESSION_SECRET}
      CONSOLE_COOKIE_SECURE: "${CONSOLE_COOKIE_SECURE:-0}"
      MAIL_MOCKER_MODE: "${MAIL_MOCKER_MODE:?set MAIL_MOCKER_MODE=1 in .env.mocker}"
    volumes:
      - mocker-data:/data
    expose:
      - "8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "${MOCKER_WEB_PORT:-3001}:3000"

volumes:
  mocker-data:
